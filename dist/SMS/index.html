<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMS Notifications | MOJO AI Summits</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/logo-badge.png">
  <link rel="apple-touch-icon" href="/assets/logo-badge.png">
  <link rel="stylesheet" href="/assets/mojo-brand-compliance.css">
  <style>
    :root {
      --deep-navy: #0A0F1E;
      --slate: #1B2333;
      --cyan: #00E6FF;
      --blue: #1666FF;
      --white: #FFFFFF;
      --muted: rgba(255, 255, 255, 0.68);
      --line: rgba(0, 230, 255, 0.24);
      --danger: #ff637b;
      --ok: #6AF0B6;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      background:
        radial-gradient(circle at 16% 10%, rgba(22, 102, 255, 0.26), transparent 34rem),
        radial-gradient(circle at 82% 14%, rgba(0, 230, 255, 0.16), transparent 30rem),
        linear-gradient(145deg, #050814 0%, var(--deep-navy) 52%, #07101f 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1.4rem clamp(1rem, 4vw, 3rem);
      border-bottom: 1px solid var(--line);
      background: rgba(10, 15, 30, 0.78);
    }

    a { color: var(--cyan); text-decoration: none; }
    .brand { display: grid; gap: 0.25rem; }
    .brand strong { letter-spacing: 0.1em; text-transform: uppercase; }
    .brand span { color: var(--cyan); font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase; }
    .top-nav { display: flex; gap: 1rem; flex-wrap: wrap; font-weight: 800; }

    main {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 4rem;
      display: grid;
      gap: 1rem;
    }

    .hero, .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(27, 35, 51, 0.72);
      box-shadow: 0 18px 56px rgba(0, 0, 0, 0.28);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 0.35fr);
      gap: 1rem;
      padding: clamp(1.4rem, 4vw, 2.4rem);
      align-items: end;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(2.5rem, 7vw, 5.2rem);
      line-height: 0.96;
    }

    .eyebrow, label {
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    p { color: var(--muted); line-height: 1.65; }
    .metric { display: grid; gap: 0.25rem; justify-items: end; }
    .metric strong { color: var(--cyan); font-size: clamp(2.4rem, 8vw, 5rem); line-height: 1; }
    .metric span { color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; }

    .panel {
      padding: clamp(1rem, 3vw, 1.5rem);
      display: grid;
      gap: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 0.7fr) minmax(280px, 0.3fr);
      gap: 1rem;
      align-items: start;
    }

    .field { display: grid; gap: 0.55rem; }
    select, textarea {
      width: 100%;
      border: 1px solid rgba(0, 230, 255, 0.26);
      border-radius: 6px;
      background: rgba(10, 15, 30, 0.78);
      color: var(--white);
      padding: 0.9rem;
      font: inherit;
    }
    textarea { min-height: 12rem; resize: vertical; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      border: 1px solid var(--cyan);
      border-radius: 6px;
      background: rgba(22, 102, 255, 0.22);
      color: var(--white);
      cursor: pointer;
      font-weight: 900;
      letter-spacing: 0.12em;
      min-height: 3rem;
      padding: 0.75rem 1rem;
      text-transform: uppercase;
    }
    button:disabled { cursor: not-allowed; opacity: 0.48; }
    .secondary { border-color: rgba(255, 255, 255, 0.24); background: rgba(10, 15, 30, 0.62); }
    .danger { border-color: rgba(255, 99, 123, 0.7); }

    .notice {
      min-height: 1.4rem;
      color: var(--muted);
      font-weight: 800;
    }
    .notice.ok { color: var(--ok); }
    .notice.error { color: var(--danger); }

    .recipient-list, .result-list {
      display: grid;
      gap: 0.55rem;
      max-height: 24rem;
      overflow: auto;
    }
    .row {
      display: grid;
      gap: 0.2rem;
      padding: 0.75rem;
      border: 1px solid rgba(0, 230, 255, 0.14);
      border-radius: 6px;
      background: rgba(10, 15, 30, 0.5);
    }
    .row strong { color: var(--white); }
    .row span { color: var(--muted); font-size: 0.9rem; }
    .row.failed { border-color: rgba(255, 99, 123, 0.5); }

    .checkbox-row {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      color: var(--muted);
      line-height: 1.5;
    }
    .checkbox-row input { margin-top: 0.25rem; }

    @media (max-width: 820px) {
      .hero, .grid { grid-template-columns: 1fr; }
      .metric { justify-items: start; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/admin/">
      <strong>MOJO AI Summits</strong>
      <span>SMS notifications</span>
    </a>
    <nav class="top-nav" aria-label="Admin links">
      <a href="/crm/">CRM</a>
      <a href="/access/">Access</a>
      <a href="/sms-terms/">SMS Terms</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">Verified phone sender</p>
        <h1>Send SMS updates.</h1>
        <p>Messages go only to phone numbers that have completed registration phone verification.</p>
      </div>
      <div class="metric">
        <strong id="recipientCount">0</strong>
        <span>verified numbers</span>
      </div>
    </section>

    <section class="grid">
      <form class="panel" id="smsForm">
        <div class="field">
          <label for="messageType">Message type</label>
          <select id="messageType" name="type">
            <option value="event-reminder">Upcoming event reminder</option>
            <option value="additional-event-notice">Additional event notice</option>
          </select>
        </div>
        <div class="field">
          <label for="messageText">Message</label>
          <textarea id="messageText" name="message" maxlength="1200" placeholder="MOJO AI Summits: Reminder text goes here."></textarea>
        </div>
        <div class="toolbar">
          <span id="charCount">0 / 1200</span>
          <button type="button" class="secondary" id="refreshButton">Refresh Recipients</button>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="confirmSend">
          <span>I understand this will send to every verified phone number listed for MOJO AI Summits registrations.</span>
        </label>
        <button type="submit" class="danger" id="sendButton">Send SMS</button>
        <p class="notice" id="notice" aria-live="polite"></p>
      </form>

      <aside class="panel">
        <div class="toolbar">
          <div>
            <p class="eyebrow">Recipients</p>
            <p id="lastNotice">Loading...</p>
          </div>
        </div>
        <div class="recipient-list" id="recipientList"></div>
      </aside>
    </section>

    <section class="panel">
      <p class="eyebrow">Send results</p>
      <div class="result-list" id="resultList"></div>
    </section>
  </main>

  <script>
    const api = "/api/sms-notifications";
    const recipientCount = document.querySelector("#recipientCount");
    const recipientList = document.querySelector("#recipientList");
    const resultList = document.querySelector("#resultList");
    const notice = document.querySelector("#notice");
    const lastNotice = document.querySelector("#lastNotice");
    const messageText = document.querySelector("#messageText");
    const charCount = document.querySelector("#charCount");
    const form = document.querySelector("#smsForm");
    const sendButton = document.querySelector("#sendButton");
    const refreshButton = document.querySelector("#refreshButton");
    const confirmSend = document.querySelector("#confirmSend");
    const messageType = document.querySelector("#messageType");

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character]));
    }

    function setNotice(message, type = "") {
      notice.textContent = message || "";
      notice.className = `notice ${type}`.trim();
    }

    async function readJson(response) {
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || "Request failed.");
      return payload;
    }

    function renderRecipients(payload) {
      const recipients = payload.recipients || [];
      recipientCount.textContent = recipients.length;
      lastNotice.textContent = payload.summary?.lastAdditionalNoticeAt
        ? `Last monthly event notice: ${new Date(payload.summary.lastAdditionalNoticeAt).toLocaleString()}`
        : "No monthly event notice has been recorded.";
      recipientList.innerHTML = recipients.length
        ? recipients.map((recipient) => `
            <div class="row">
              <strong>${escapeHtml(recipient.maskedPhone)}</strong>
              <span>${escapeHtml((recipient.sources || []).join(", "))}</span>
              <span>${recipient.lastVerifiedAt ? `Verified ${escapeHtml(new Date(recipient.lastVerifiedAt).toLocaleString())}` : "Verified phone"}</span>
            </div>
          `).join("")
        : "<p>No verified phone numbers are available yet.</p>";
    }

    function renderResults(results = []) {
      resultList.innerHTML = results.length
        ? results.map((result) => `
            <div class="row ${result.status === "failed" ? "failed" : ""}">
              <strong>${escapeHtml(result.phone)} | ${escapeHtml(result.status)}</strong>
              <span>${escapeHtml(result.messageId || result.error || "")}</span>
            </div>
          `).join("")
        : "<p>No SMS send has been run from this page yet.</p>";
    }

    async function loadRecipients() {
      setNotice("Loading verified phone numbers...");
      try {
        const payload = await fetch(api).then(readJson);
        renderRecipients(payload);
        setNotice("Verified phone numbers loaded.", "ok");
      } catch (error) {
        setNotice(error.message, "error");
      }
    }

    messageText.addEventListener("input", () => {
      charCount.textContent = `${messageText.value.length} / 1200`;
    });

    refreshButton.addEventListener("click", loadRecipients);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!confirmSend.checked) {
        setNotice("Confirm that you want to send to all verified phone numbers.", "error");
        return;
      }
      sendButton.disabled = true;
      setNotice("Sending SMS notifications...");
      try {
        const payload = await fetch(api, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            type: messageType.value,
            message: messageText.value
          })
        }).then(readJson);
        const result = payload.result || {};
        renderResults(result.results || []);
        setNotice(`SMS complete: ${result.sentCount || 0} sent, ${result.failedCount || 0} failed.`, result.failedCount ? "error" : "ok");
        confirmSend.checked = false;
        await loadRecipients();
      } catch (error) {
        setNotice(error.message, "error");
      } finally {
        sendButton.disabled = false;
      }
    });

    renderResults();
    loadRecipients();
  </script>
<link rel="stylesheet" href="/assets/mojo-brand-compliance.css" data-brand-compliance-final>
</body>
</html>
