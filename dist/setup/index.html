<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Mojo AI Summits - Master Event Execution Checklist</title>
  <style>
    :root {
      --ink: #171717;
      --muted: #62666f;
      --line: #d9dde5;
      --paper: #fbfaf7;
      --panel: #ffffff;
      --charcoal: #25272d;
      --red: #b64242;
      --teal: #167f83;
      --gold: #b7832f;
      --green: #4f7d45;
      --blue: #496caa;
      --owner-scott: #2563eb;
      --owner-robert: #15803d;
      --owner-jodi: #d97706;
      --owner-ron: #dc2626;
      --owner-charlie: #7c3aed;
      --owner-angel: #0891b2;
      --owner-tel: #be185d;
      --owner-pakistani-marketing: #475569;
      --owner-photo-sound-cinema: #0f766e;
      --owner-unknown: #6b7280;
      --shadow: 0 18px 48px rgba(30, 32, 38, 0.12);
      --radius: 8px;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 18px;
      background: #f0eee7;
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }

    main {
      min-width: 0;
      padding: 28px clamp(18px, 3vw, 44px) 64px;
    }

    .brand {
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand .eyebrow {
      margin: 0 0 8px;
      color: var(--red);
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 2.8vw, 3rem);
      line-height: 1.02;
      letter-spacing: 0;
      max-width: 920px;
    }

    h2 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 1.02rem;
      letter-spacing: 0;
    }

    p {
      margin: 0;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 12px;
      margin: 22px 0 18px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 8px 24px rgba(30, 32, 38, 0.06);
      min-height: 86px;
    }

    .metric strong {
      display: block;
      font-size: 1.35rem;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .toolbar {
      display: grid;
      gap: 14px;
    }

    .control-group {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .control-label {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
      outline: none;
    }

    .search:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(22, 127, 131, 0.16);
    }

    .filter-select,
    .filter-date {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--charcoal);
      padding: 8px 10px;
      outline: none;
    }

    .filter-select:focus,
    .filter-date:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(22, 127, 131, 0.16);
    }

    .date-filter-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
    }

    .date-clear-btn {
      width: 38px;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--charcoal);
      cursor: pointer;
      font-weight: 900;
    }

    .date-clear-btn:hover {
      border-color: #aeb6c2;
    }

    .segmented {
      display: grid;
      gap: 6px;
    }

    .filter-btn,
    .action-btn {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--charcoal);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      text-align: left;
    }

    .filter-btn:hover,
    .action-btn:hover {
      border-color: #aeb6c2;
    }

    .filter-btn.active {
      border-color: var(--charcoal);
      background: var(--charcoal);
      color: #fff;
    }

    .filter-count {
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.07);
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 700;

    .filter-btn.active .filter-count {

    }

    .actions {

      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--line);

    .action-btn {

      font-weight: 700;

    .section {
      margin-top: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: visible;

    .section-header {

      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      padding: 18px 20px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .section-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .section-body {
      display: grid;
      gap: 16px;
      padding: 18px;
    }

    .subsection {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: visible;
      background: #fff;
    }

    .subsection-title {
      padding: 12px 14px;
      background: #f7f6f2;
      border-bottom: 1px solid var(--line);

    .items {
      display: grid;

    .item {

      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      gap: 10px 14px;

      min-height: 50px;
      padding: 12px 14px;
      border-top: 1px solid #eef0f4;

    .item:first-child {

    .item.hidden {

    }

      border-left-color: var(--owner-jodi);
    }

    .owner-select.owner-ron {
      border-left-color: var(--owner-ron);
    }

    .owner-select.owner-charlie {
      border-left-color: var(--owner-charlie);
    }

    .owner-select.owner-angel {
      border-left-color: var(--owner-angel);
    }

    .owner-select.owner-tel {
      border-left-color: var(--owner-tel);
    }

    .owner-select.owner-pakistani-marketing {

    .owner-select.owner-photo-sound-cinema {

      border-color: var(--charcoal);

    .support-picker {

    .support-summary {

    .support-summary::after {
      content: "▾";

      font-size: 0.72rem;
    }

    .support-menu {

    .owner-scott {

    }

    .owner-robert {
      background: var(--owner-robert);
    }

    .owner-jodi {
      background: var(--owner-jodi);
    }

    .owner-ron {
      background: var(--owner-ron);
    }

    .owner-charlie {
      background: var(--owner-charlie);
    }

    .owner-angel {
      background: var(--owner-angel);
    }

    .owner-tel {
      background: var(--owner-tel);
    }

    .owner-pakistani-marketing {
      background: var(--owner-pakistani-marketing);
    }

    .owner-photo-sound-cinema {
      background: var(--owner-photo-sound-cinema);
    }

    }

    .owner-grid {

    @media (max-width: 1000px) {

  <script type="text/plain" id="source-md"># Master Event Execution Checklist

Date: 2026-07-25
Version: 2.9
Category: event operations

## Purpose

This checklist defines the work required to stand up Mojo AI Summits and execute events. It includes a one-time company foundation checklist plus repeatable pre-event, during-event, and post-event phases.

Each item has one accountable owner. Other team members may support, but the owner is responsible for making sure the item is completed or deliberately deferred.

Status: provisional. This draft assigns ownership across the expanded operating team. It should not be treated as final event strategy.

Future event-specific copies should remove the one-time company foundation section and keep only the repeatable per-event checklist items.

## Confirmed Event Model

- First event: Mojo AI Summit Dallas.
- First event timing: second week of January 2027, exact date TBD.
- Target attendance: 150 curated leaders.
- Target audience composition: executive-heavy audience across CEO, CFO, COO, CIO, CISO, CAIO/CTO, and director-and-above leaders.
- Audience level: director and above.
- Target company size: generally 5,000 or more employees.
- Audience acquisition model: all attendees are curated through individual invitations.
- VIP definition: any attendee with a speaking role or roundtable leadership role is a VIP.
- Executive attendee definition: every other curated executive or director-and-above attendee is an executive attendee.
- VIP handling model: VIP treatment is based on contribution role, not title alone.
- Target vendor count: 36 vendors.
- Core event length: six hours.
- Event format: six tracks using boardroom-style programming.
- Boardroom block format: 15-minute presentation followed by a 15-minute roundtable.
- Boardroom cadence: boardroom blocks may repeat within each hour across the six tracks, depending on final run-of-show design.
- Attendee experience extensions: optional early event value experiences may be offered before the six-hour core event, such as golf pro training or other special experiences.
- After-hours experience extensions: optional post-event experiences may be offered after the six-hour core event, such as cowboy ranch leadership, performance driving, helicopter rides, or other premium experiences.
- Sponsor presence: no booths, tables, or traditional expo footprint.
- Sponsor attendee model: each sponsor is expected to have one executive sales or marketing team member on site and one additional presentation-engaged executive.
- Sponsor upsells: sponsors may purchase speaking opportunities or workshop leadership opportunities.
- Executive access area: not used; the event audience is already curated for executives and director-and-above leaders.
- Expo model: no expo floor, no booths, and no tables.
- Attendee tickets: no paid attendee tickets; all curated attendee access is comped/invited.
- Funding model: sponsor-funded event.
- Revenue model: first-event revenue target is $100,000 total gross revenue from sponsor revenue. This is a planning goal, not a minimum threshold.
- Revenue uncertainty: first-event sponsor count, final standard sponsor price, and sponsor upsell conversion are not yet validated.
- Sponsor revenue model: nearly all vendors are expected to pay a base sponsorship fee for curated senior-leader access and sponsor deliverables, not booth/tabletop presence.
- Standard sponsor package: no bronze, silver, or gold tiers for the initial event; every base sponsor package is the same.
- Working standard sponsor price range: expected to be $3,500 to $5,000 for the initial event, with final determination later.
- Working base sponsor revenue: TBD for the 150-leader model.
- Sponsor package definition: benefits and deliverables for the standard sponsor package still need to be defined.
- Sponsor upsell model: additional sponsor revenue may come from selected upsells, such as speaking slots, workshop leadership, meal sponsorships, drink/bar sponsorships, and similar event activations.
- Workshop model: undecided. Workshops may become sponsor-led, attendee-paid add-ons, included programming, or excluded from the first event.
- Advisory/team board model: expected to include at least three groups and possibly four.
- Advisory/team board 1: Sponsor Marketing/Sales Advisory Board.
- Advisory/team board 2: Sponsor Executive Board.
- Advisory/team board 3: Mojo AI Summits Cohort Advisory Board.
- Advisory/team board 4: Mojo AI Summits Dallas Event VIPs, if used as a distinct group for attendees with speaking or roundtable leadership roles.
- Advisory/team board dinner model: each advisory team or board is expected to have a separate dinner event.
- Sponsor Marketing/Sales Advisory Board dinner: targeted for one month before the event.
- Mojo AI Summits Cohort Advisory Board dinner: targeted for two months before the event.
- VIP Dinner: targeted for the night before the event.
- Sponsor Executive Board dinner: targeted for after the event, unless it occurs on the same day or the event has a nighttime schedule; in those cases, the board meal will not occur.
- Board and VIP dinner funding: dinners should be sponsor-funded where possible.
- VIP travel and hotel support: Mojo may cover travel and hotel stays for selected VIPs; travel support is not automatically granted to every VIP.
- VIP travel/hotel eligibility: primarily based on speaking role, roundtable leadership role, keynote importance, strategic value, and approved budget. Mojo AI Summits team travel and hotel also need to be covered.
- VIP travel/hotel ownership: Ron owns making sure VIP travel and hotel coordination happens. Robert owns funding, pricing research, approved spend, and direct bookings when Mojo is paying.
- VIP travel/hotel process: when VIPs are paying their own way, Robert finds pricing and location options for Ron, and Ron passes those options to the VIPs. When Mojo is paying, Robert books directly and Ron passes confirmed information to the VIPs.

## Open Decisions and Accountable Owners

This section is reserved for decisions that do not yet have an assigned operating home. Current decision-definition work has been distributed into the relevant checklist sections below.

## Owner Key

| Owner | Area |
|---|---|
| Scott | Event concept, event value, strategic structure, attendee experience quality, soul standard |
| Robert | CEO, finance, taxes, purchasing, contracts, budget, legal/administrative controls |
| Jodi | Sponsors, marketing, website, public campaigns, sponsor fulfillment, invite-support materials |
| Ron | Curated director-and-above invites, executive relationships, keynote/executive recruitment, public face of company |
| Charlie | Event management, venue coordination, production logistics, staffing, registration operations, on-site command center |

## Cross-Owner Decision Triggers

The following decisions should not be made by one owner alone:

- Changing the event date, city, or venue after public launch.
- Accepting a sponsor whose participation may compromise trust or event quality.
- Giving a sponsor stage access outside the approved sponsor model.
- Removing a major speaker, track, dinner, or executive format.
- Spending materially beyond the approved event budget.
- Changing attendee data sharing rules.
- Publishing post-event claims that depend on confidential or unattributed discussion.
- Making promises that affect another owner's area.

</script>

  <script>
    const ownerColors = {
      Scott: "owner-scott",
      Robert: "owner-robert",
      Jodi: "owner-jodi",
      Ron: "owner-ron",
      Charlie: "owner-charlie",
      Angel: "owner-angel",
      "The Event Lounge (TEL)": "owner-tel",
      "Pakistani Marketing Team": "owner-pakistani-marketing",
      "Photography, Sound, and Cinematography Team": "owner-photo-sound-cinema",
      "I don't know": "owner-unknown",
      Shared: "owner-shared",
      all: "owner-all"
    };

    const supportOwners = ["Scott", "Robert", "Jodi", "Ron", "Charlie", "Angel", "The Event Lounge (TEL)", "Pakistani Marketing Team", "Photography, Sound, and Cinematography Team"];
    const editableOwners = [...supportOwners, "I don't know"];
    const ownerFilterOptions = ["All", ...editableOwners, "Shared"];
    const priorityOptions = [
      "Priority 1 - 3 months out",
      "Priority 2 - 2 months out",
      "Priority 3 - 3 months out",
      "Priority 4 - 2 weeks out",
      "Priority 5 - 1 week out",
      "Priority 6 - 2 days out",
      "Priority 7 - 1 day out",
      "Priority 8 - Day of"
    ];
    const statusOptions = ["Undefined", "Defined", "Planning", "Building", "Testing", "Ready", "Delivered"];
    const assignmentStoragePrefix = "mojo-event-assignment:";

    const state = {
      phase: "All",
      owner: "All",
      priority: "All",
      dueDate: "",
      status: "All",
      query: ""
    };

    const raw = document.getElementById("source-md").textContent.trim();
    const lines = raw.split(/\r?\n/);
    const sections = [];
    const ownerKey = [];
    let current = null;
    let currentSub = null;
    let ownerTableMode = false;

    const clean = (value) => value.trim().replace(/\.$/, "");
    const slug = (value) => value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    const ownerClass = (owner) => ownerColors[owner] || "owner-shared";
    const escapeHtml = (value) => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    function parseOwner(text) {
      const ownerMatch = text.match(/\bOwner:\s*([^.;]+)(?:\.|$)/i);
      const supportMatch = text.match(/\bSupport:\s*([^.;]+)(?:\.|$)/i);
      const owner = ownerMatch ? clean(ownerMatch[1]) : "";
      const support = supportMatch ? clean(supportMatch[1]) : "";
      const label = text
        .replace(/\s*Owner:\s*[^.;]+(?:\.|$)/i, "")
        .replace(/\s*Support:\s*[^.;]+(?:\.|$)/i, "")
        .trim();
      return { label, owner, support };
    }

    function ownerNames(value) {
      if (!value) return [];
      if (/all founders|full team/i.test(value)) return supportOwners;
      if (/relevant founder|relevant owner/i.test(value)) return ["Shared"];
      return value.split(",").map((name) => name.trim()).filter(Boolean);
    }

    function ensureSection(title) {
      current = { title, subsections: [], notes: [], type: "note" };
      sections.push(current);
      currentSub = null;
      ownerTableMode = title === "Owner Key";
      return current;
    }

    for (const line of lines) {
      if (!line.trim() || line.startsWith("# ")) continue;

      if (line.startsWith("## ")) {
        ensureSection(line.replace(/^##\s+/, "").trim());
        continue;
      }

      if (line.startsWith("### ")) {
        if (!current) ensureSection("Notes");
        current.type = "checklist";
        currentSub = { title: line.replace(/^###\s+/, "").trim(), items: [] };
        current.subsections.push(currentSub);
        continue;
      }

      if (ownerTableMode && line.startsWith("|") && !line.includes("---") && !line.includes("Owner | Area")) {
        const cells = line.split("|").map((part) => part.trim()).filter(Boolean);
        if (cells.length >= 2) ownerKey.push({ owner: cells[0], area: cells[1] });
        continue;
      }

      if (line.startsWith("- [ ] ")) {
        if (!current) ensureSection("Checklist");
        if (!currentSub) {
          current.type = "checklist";
          currentSub = { title: "Checklist", items: [] };
          current.subsections.push(currentSub);
        }
        const parsed = parseOwner(line.replace("- [ ] ", ""));
        currentSub.items.push({
          text: parsed.label,
          defaultOwner: parsed.owner || "Shared",
          defaultSupport: "",
          defaultPriority: "",
          defaultDueDate: "",
          defaultStatus: "Undefined",
          owner: parsed.owner || "Shared",
          support: "",
          priority: "",
          dueDate: "",
          status: "Undefined",
          phase: current.title,
          subsection: currentSub.title
        });
        continue;
      }

      if (line.startsWith("- ")) {
        if (!current) ensureSection("Notes");
        const text = line.replace(/^- /, "").trim();
        const parsed = parseOwner(text);
        current.notes.push({
          text: parsed.label || text,
          owner: parsed.owner,
          support: parsed.support
        });
      } else if (current && !line.startsWith("|")) {
        current.notes.push({ text: line.trim(), owner: "", support: "" });
      }
    }

    const checklistSections = sections.filter((section) => section.type === "checklist");
    const allItems = checklistSections.flatMap((section) =>
      section.subsections.flatMap((subsection) => subsection.items)
    );
    allItems.forEach((item, index) => {
      item.id = `item-${index}-${slug(item.text).slice(0, 60)}`;
    });
    const itemById = new Map(allItems.map((item) => [item.id, item]));

    function assignmentStorageKey(item) {
      return `${assignmentStoragePrefix}${item.id}`;
    }

    function normalizeSupport(value) {
      return ownerNames(value).filter((owner, index, owners) =>
        supportOwners.includes(owner) && owners.indexOf(owner) === index
      ).join(", ");
    }

    function itemSearchText(item) {
      return `${item.text} ${item.owner} ${item.support} ${item.priority} ${item.dueDate} ${item.status} ${item.phase} ${item.subsection}`.toLowerCase();
    }

    function loadSavedAssignments() {
      allItems.forEach((item) => {
        const saved = localStorage.getItem(assignmentStorageKey(item));
        if (!saved) return;

        try {
          const assignment = JSON.parse(saved);
          const owner = ownerFilterOptions.includes(assignment.owner) && assignment.owner !== "All" ? assignment.owner : item.defaultOwner;
          item.owner = owner;
          item.support = normalizeSupport(assignment.support || "");
          item.priority = priorityOptions.includes(assignment.priority) ? assignment.priority : item.defaultPriority;
          item.dueDate = /^\d{4}-\d{2}-\d{2}$/.test(assignment.dueDate || "") ? assignment.dueDate : item.defaultDueDate;
          item.status = statusOptions.includes(assignment.status) ? assignment.status : item.defaultStatus;
        } catch {
          localStorage.removeItem(assignmentStorageKey(item));
        }
      });
    }

    function saveAssignment(item) {
      localStorage.setItem(assignmentStorageKey(item), JSON.stringify({
        owner: item.owner,
        support: item.support,
        priority: item.priority,
        dueDate: item.dueDate,
        status: item.status
      }));
    }

    loadSavedAssignments();

    function countByOwner(owner) {
      return allItems.filter((item) => ownerNames(item.owner).includes(owner)).length;
    }

    function countByPhase(phase) {
      if (phase === "All") return allItems.length;
      return allItems.filter((item) => item.phase === phase).length;
    }

    function countByPriority(priority) {
      if (priority === "All") return allItems.length;
      if (priority === "No priority") return allItems.filter((item) => !item.priority).length;
      return allItems.filter((item) => item.priority === priority).length;
    }

    function countByStatus(status) {
      if (status === "All") return allItems.length;
      return allItems.filter((item) => item.status === status).length;
    }

    function renderSummary() {
      const delivered = allItems.filter((item) => item.status === "Delivered").length;
      const activeOwners = editableOwners.map((owner) => `${owner}: ${countByOwner(owner)}`).join(" / ");
      document.getElementById("summary").innerHTML = `
        <div class="metric"><strong>${allItems.length}</strong><span>Total checklist items</span></div>
        <div class="metric"><strong>${delivered}</strong><span>Delivered items</span></div>
        <div class="metric"><strong>${checklistSections.length}</strong><span>Execution phases</span></div>
        <div class="metric"><strong>${activeOwners}</strong><span>Owner item counts</span></div>
      `;
    }

    function pill(owner, type = "owner") {
      if (!owner) return "";
      return `<span class="pill ${type} ${type === "owner" ? ownerClass(owner) : ""}">${type === "owner" ? "Owner: " : "Support: "}${owner}</span>`;
    }

    function ownerSelect(item) {
      return `
        <select class="owner-select ${ownerClass(item.owner)}" data-assignment="owner" data-item-id="${item.id}" aria-label="Owner for ${escapeHtml(item.text)}">
          ${[...editableOwners, "Shared"].map((owner) => `
            <option value="${owner}" ${owner === item.owner ? "selected" : ""}>${owner}</option>
          `).join("")}
        </select>
      `;
    }

    function prioritySelect(item) {
      return `
        <select class="priority-select" data-assignment="priority" data-item-id="${item.id}" aria-label="Priority for ${escapeHtml(item.text)}">
          <option value="" ${!item.priority ? "selected" : ""}>Set priority</option>
          ${priorityOptions.map((priority) => `
            <option value="${priority}" ${priority === item.priority ? "selected" : ""}>${priority}</option>
          `).join("")}
        </select>
      `;
    }

    function dueDateInput(item) {
      return `
        <input class="date-input" type="date" data-assignment="due-date" data-item-id="${item.id}" value="${escapeHtml(item.dueDate)}" aria-label="Expected delivery date for ${escapeHtml(item.text)}">
      `;
    }

    function statusSelect(item) {
      return `
        <div class="status-field">
          <span class="assignment-label">Status</span>
          <select class="status-select" data-assignment="status" data-item-id="${item.id}" aria-label="Status for ${escapeHtml(item.text)}">
            ${statusOptions.map((status) => `
              <option value="${status}" ${status === item.status ? "selected" : ""}>${status}</option>
            `).join("")}
          </select>
        </div>
      `;
    }

    function supportSummary(item) {
      const names = ownerNames(item.support).filter((owner) => supportOwners.includes(owner));
      return names.length ? `Support: ${names.join(", ")}` : "Support: None";
    }

    function supportPicker(item) {
      const selected = ownerNames(item.support);
      return `
        <details class="support-picker" data-support-picker data-item-id="${item.id}">
          <summary class="support-summary">${escapeHtml(supportSummary(item))}</summary>
          <div class="support-menu">
            ${supportOwners.map((owner) => `
              <label class="support-option">
                <input type="checkbox" data-assignment="support" data-item-id="${item.id}" value="${owner}" ${selected.includes(owner) ? "checked" : ""}>
                <span>${owner}</span>
              </label>
            `).join("")}
          </div>
        </details>
      `;
    }

    function closeSupportPickers(exceptPicker = null) {
      document.querySelectorAll("[data-support-picker][open]").forEach((picker) => {
        if (picker !== exceptPicker) picker.open = false;
      });
    }

    function assignmentControls(item) {
      return `
        <div class="assignment-controls">
          <div class="assignment-field">
            <span class="assignment-label">Owner</span>
            ${ownerSelect(item)}
          </div>
          <div class="assignment-field">
            <span class="assignment-label">Support</span>
            ${supportPicker(item)}
          </div>
          <div class="assignment-field">
            <span class="assignment-label">Priority</span>
            ${prioritySelect(item)}
          </div>
          <div class="assignment-field">
            <span class="assignment-label">Expected Delivery Date</span>
            ${dueDateInput(item)}
          </div>
        </div>
      `;
    }

    function renderNotes(section) {
      if (section.title === "Owner Key") {
        return `
          <section class="section" data-note-section="${section.title}">
            <div class="section-header"><h2>${section.title}</h2></div>
            <div class="section-body">
              <div class="owner-grid">
                ${ownerKey.map((row) => `
                  <div class="owner-card">
                    <strong><span class="dot ${ownerClass(row.owner)}"></span>${row.owner}</strong>
                    <p>${row.area}</p>
                  </div>
                `).join("")}
              </div>
            </div>
          </section>
        `;
      }

      return `
        <section class="section" data-note-section="${section.title}">
          <div class="section-header"><h2>${section.title}</h2></div>
          <div class="notes">
            <ul class="note-list">
              ${section.notes.map((note) => `
                <li>
                  ${note.text}
                  ${note.owner ? `<div class="owner-block">${pill(note.owner)}${note.support ? pill(note.support, "support") : ""}</div>` : ""}
                </li>
              `).join("")}
            </ul>
          </div>
        </section>
      `;
    }

    function renderContent() {
      const introSections = sections.filter((section) => section.type !== "checklist" && section.title !== "Version History");
      const checklistHtml = checklistSections.map((section) => {
        const total = countByPhase(section.title);
        return `
          <section class="section checklist-section" data-phase="${section.title}">
            <div class="section-header">
              <div>
                <h2>${section.title}</h2>
                <div class="section-meta"><span>${total} items</span></div>
              </div>
            </div>
            <div class="section-body">
              ${section.subsections.map((subsection) => `
                <div class="subsection">
                  <div class="subsection-title"><h3>${subsection.title}</h3></div>
                  <div class="items">
                    ${subsection.items.map((item) => `
                      <div class="item" data-item-id="${item.id}" data-phase="${escapeHtml(item.phase)}" data-owner="${escapeHtml(item.owner)}" data-support="${escapeHtml(item.support)}" data-priority="${escapeHtml(item.priority)}" data-due-date="${escapeHtml(item.dueDate)}" data-status="${escapeHtml(item.status)}" data-search="${escapeHtml(itemSearchText(item))}">
                        <span class="item-text">${escapeHtml(item.text)}</span>
                        ${assignmentControls(item)}
                        ${statusSelect(item)}
                      </div>
                    `).join("")}
                  </div>
                </div>
              `).join("")}
            </div>
          </section>
        `;
      }).join("");

      document.getElementById("content").innerHTML = introSections.map(renderNotes).join("") + checklistHtml;

      document.querySelectorAll('select[data-assignment="owner"]').forEach((select) => {
        select.addEventListener("change", () => {
          const item = itemById.get(select.dataset.itemId);
          if (!item) return;
          item.owner = select.value;
          saveAssignment(item);
          updateAssignmentRow(item);
        });
      });

      document.querySelectorAll('select[data-assignment="status"]').forEach((select) => {
        select.addEventListener("change", () => {
          const item = itemById.get(select.dataset.itemId);
          if (!item) return;
          item.status = select.value;
          saveAssignment(item);
          updateAssignmentRow(item);
        });
      });

      document.querySelectorAll('select[data-assignment="priority"]').forEach((select) => {
        select.addEventListener("change", () => {
          const item = itemById.get(select.dataset.itemId);
          if (!item) return;
          item.priority = select.value;
          saveAssignment(item);
          updateAssignmentRow(item);
        });
      });

      document.querySelectorAll('input[data-assignment="due-date"]').forEach((input) => {
        input.addEventListener("change", () => {
          const item = itemById.get(input.dataset.itemId);
          if (!item) return;
          item.dueDate = input.value;
          saveAssignment(item);
          updateAssignmentRow(item);
        });
      });

      document.querySelectorAll('input[data-assignment="support"]').forEach((input) => {
        input.addEventListener("change", () => {
          const item = itemById.get(input.dataset.itemId);
          const row = input.closest(".item");
          if (!item || !row) return;
          const selected = Array.from(row.querySelectorAll('input[data-assignment="support"]:checked')).map((checkbox) => checkbox.value);
          item.support = selected.join(", ");
          saveAssignment(item);
          updateAssignmentRow(item);
        });
      });

      document.querySelectorAll("[data-support-picker]").forEach((picker) => {
        picker.addEventListener("toggle", () => {
          if (picker.open) closeSupportPickers(picker);
        });
      });
    }

    function updateAssignmentRow(item) {
      const row = document.querySelector(`.item[data-item-id="${item.id}"]`);
      if (!row) return;

      row.dataset.owner = item.owner;
      row.dataset.support = item.support;
      row.dataset.priority = item.priority;
      row.dataset.dueDate = item.dueDate;
      row.dataset.status = item.status;
      row.dataset.search = itemSearchText(item);

      const select = row.querySelector('select[data-assignment="owner"]');
      if (select) {
        select.className = `owner-select ${ownerClass(item.owner)}`;
        select.value = item.owner;
      }

      const summary = row.querySelector(".support-summary");
      if (summary) {
        summary.textContent = supportSummary(item);
      }

      const prioritySelect = row.querySelector('select[data-assignment="priority"]');
      if (prioritySelect) {
        prioritySelect.value = item.priority;
      }

      const dueDateInput = row.querySelector('input[data-assignment="due-date"]');
      if (dueDateInput) {
        dueDateInput.value = item.dueDate;
      }

      const statusSelect = row.querySelector('select[data-assignment="status"]');
      if (statusSelect) {
        statusSelect.value = item.status;
      }

      renderSummary();
      renderFilters();
      applyFilters();
    }

    function renderFilters() {
      const phaseOptions = ["All", ...checklistSections.map((section) => section.title)];
      const priorityFilterOptions = ["All", "No priority", ...priorityOptions];
      const statusFilterOptions = ["All", ...statusOptions];

      document.getElementById("phaseFilters").innerHTML = phaseOptions.map((phase) => `
        <button class="filter-btn ${phase === state.phase ? "active" : ""}" data-filter-type="phase" data-value="${phase}" type="button">
          <span>${phase}</span><span class="filter-count">${countByPhase(phase)}</span>
        </button>
      `).join("");

      document.getElementById("ownerFilters").innerHTML = ownerFilterOptions.map((owner) => `
        <button class="filter-btn ${owner === state.owner ? "active" : ""}" data-filter-type="owner" data-value="${owner}" type="button">
          <span>${owner}</span><span class="filter-count">${owner === "All" ? allItems.length : countByOwner(owner)}</span>
        </button>
      `).join("");

      document.getElementById("priorityFilter").innerHTML = priorityFilterOptions.map((priority) => `
        <option value="${escapeHtml(priority)}" ${priority === state.priority ? "selected" : ""}>${escapeHtml(priority)} (${countByPriority(priority)})</option>
      `).join("");

      document.getElementById("statusFilter").innerHTML = statusFilterOptions.map((status) => `
        <option value="${escapeHtml(status)}" ${status === state.status ? "selected" : ""}>${escapeHtml(status)} (${countByStatus(status)})</option>
      `).join("");

      document.getElementById("dateFilter").value = state.dueDate;

      document.querySelectorAll(".filter-btn").forEach((button) => {
        button.addEventListener("click", () => {
          state[button.dataset.filterType] = button.dataset.value;
          renderFilters();
          applyFilters();
        });
      });
    }

    function applyFilters() {
      const query = state.query.trim().toLowerCase();
      let visibleCount = 0;

      document.querySelectorAll(".item").forEach((item) => {
        const itemOwners = ownerNames(item.dataset.owner);
        const phaseOk = state.phase === "All" || item.dataset.phase === state.phase;
        const ownerOk = state.owner === "All" || itemOwners.includes(state.owner);
        const priorityOk = state.priority === "All" ||
          (state.priority === "No priority" ? !item.dataset.priority : item.dataset.priority === state.priority);
        const dateOk = !state.dueDate || item.dataset.dueDate === state.dueDate;
        const statusOk = state.status === "All" || item.dataset.status === state.status;
        const searchOk = !query || item.dataset.search.includes(query);
        const visible = phaseOk && ownerOk && priorityOk && dateOk && statusOk && searchOk;
        item.classList.toggle("hidden", !visible);
        if (visible) visibleCount += 1;
      });

      document.querySelectorAll(".checklist-section").forEach((section) => {
        const hasVisibleItems = Array.from(section.querySelectorAll(".item")).some((item) => !item.classList.contains("hidden"));
        const phaseOk = state.phase === "All" || section.dataset.phase === state.phase;
        section.style.display = hasVisibleItems && phaseOk ? "" : "none";
      });

      document.getElementById("emptyState").classList.toggle("visible", visibleCount === 0);
    }

    document.getElementById("search").addEventListener("input", (event) => {
      state.query = event.target.value;
      applyFilters();
    });

    document.getElementById("priorityFilter").addEventListener("change", (event) => {
      state.priority = event.target.value;
      applyFilters();
    });

    document.getElementById("dateFilter").addEventListener("change", (event) => {
      state.dueDate = event.target.value;
      applyFilters();
    });

    document.getElementById("clearDateFilter").addEventListener("click", () => {
      state.dueDate = "";
      document.getElementById("dateFilter").value = "";
      applyFilters();
    });

    document.getElementById("statusFilter").addEventListener("change", (event) => {
      state.status = event.target.value;
      applyFilters();
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest("[data-support-picker]")) {
        closeSupportPickers();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeSupportPickers();
      }
    });

    document.getElementById("clearStatuses").addEventListener("click", () => {
      allItems.forEach((item) => {
        item.status = item.defaultStatus;
        localStorage.removeItem(item.id);
        saveAssignment(item);
      });
      renderContent();
      renderFilters();
      renderSummary();
      applyFilters();
    });

    document.getElementById("resetAssignments").addEventListener("click", () => {
      allItems.forEach((item) => {
        item.owner = item.defaultOwner;
        item.support = item.defaultSupport;
        item.priority = item.defaultPriority;
        item.dueDate = item.defaultDueDate;
        item.status = item.defaultStatus;
        localStorage.removeItem(assignmentStorageKey(item));
      });
      renderContent();
      renderFilters();
      renderSummary();
      applyFilters();
    });

    renderContent();
    renderFilters();
    renderSummary();
    applyFilters();
  </script>
</body>
</html>
