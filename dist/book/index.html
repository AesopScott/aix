<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/logo-badge.png">
  <link rel="apple-touch-icon" href="/assets/logo-badge.png">
<link rel="stylesheet" href="/assets/mojo-brand-compliance.css">
  <title>Book Mojo AI Summits</title>
  <style>
    :root {
      --deep-navy: #0A0F1E;
      --electric-blue: #1666FF;
      --cyan: #00E6FF;
      --slate: #1B2333;
      --white: #FFFFFF;
      --text: #F3FAFF;
      --muted: rgba(255, 255, 255, 0.68);
      --line: rgba(0, 230, 255, 0.24);
      --panel: rgba(27, 35, 51, 0.86);
      --danger: #FF6F87;
      --ok: #6AF0B6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(22, 102, 255, 0.22), transparent 30rem),
        linear-gradient(180deg, #050814 0%, var(--deep-navy) 48%, #07101F 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: rgba(10, 15, 30, 0.88);
      backdrop-filter: blur(16px);
    }

    .topbar,
    main {
      width: min(980px, calc(100% - 1.5rem));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--white);
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    nav a {
      color: var(--cyan);
      font-weight: 800;
      text-decoration: none;
      font-size: 0.9rem;
    }

    main {
      display: grid;
      grid-template-columns: minmax(220px, 0.55fr) minmax(0, 1.45fr);
      align-items: start;
      gap: 0.75rem;
      padding: 1rem 0 2rem;
    }

    section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(27, 35, 51, 0.94), rgba(10, 15, 30, 0.82)),
        var(--slate);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .panel {
      padding: 1rem;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      letter-spacing: 0;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      line-height: 1;
      margin-bottom: 0.45rem;
    }

    h2 { font-size: 1.15rem; }
    h3 { font-size: 1rem; }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    label {
      display: grid;
      gap: 0.45rem;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.62rem 0.72rem;
      color: var(--text);
      background: rgba(10, 15, 30, 0.78);
      font: inherit;
      letter-spacing: 0;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      color: var(--deep-navy);
      border-color: transparent;
      background: linear-gradient(90deg, var(--cyan), #7AF4FF);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    button.secondary {
      color: var(--cyan);
      border-color: var(--line);
      background: rgba(10, 15, 30, 0.78);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .stack { display: grid; gap: 0.75rem; }
    .compact { display: grid; gap: 0.55rem; }

    .team-list,
    .slots {
      display: grid;
      gap: 0.5rem;
    }

    .slots {
      max-height: min(58vh, 520px);
      overflow: auto;
      padding-right: 0.15rem;
    }

    .person,
    .slot {
      border: 1px solid rgba(0, 230, 255, 0.18);
      border-radius: 8px;
      padding: 0.62rem 0.72rem;
      background: rgba(10, 15, 30, 0.54);
      text-align: left;
    }

    .person {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      align-items: center;
      gap: 0.7rem;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border: 1px solid rgba(0, 230, 255, 0.34);
      border-radius: 8px;
      object-fit: cover;
      background: rgba(0, 230, 255, 0.08);
      color: var(--white);
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .person-copy {
      display: grid;
      gap: 0.18rem;
      min-width: 0;
    }

    .person.active,
    .slot.active {
      border-color: var(--cyan);
      box-shadow: 0 0 0 1px rgba(0, 230, 255, 0.2);
    }

    .person strong,
    .slot strong {
      color: var(--white);
      font-size: 0.94rem;
    }

    .meta {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
    }

    .date-picker {
      position: relative;
      display: grid;
      gap: 0.45rem;
    }

    .date-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      color: var(--text);
      border-color: var(--line);
      background: rgba(10, 15, 30, 0.78);
      text-align: left;
      text-transform: none;
      letter-spacing: 0;
    }

    .date-trigger span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .date-trigger::after {
      content: "";
      width: 0.72rem;
      height: 0.72rem;
      border-right: 2px solid var(--cyan);
      border-bottom: 2px solid var(--cyan);
      transform: rotate(45deg) translateY(-0.15rem);
      flex: 0 0 auto;
    }

    .calendar-popover {
      position: absolute;
      z-index: 10;
      top: calc(100% + 0.4rem);
      right: 0;
      width: min(100%, 21rem);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.75rem;
      background: rgba(10, 15, 30, 0.98);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .calendar-head {
      display: grid;
      grid-template-columns: 2.25rem 1fr 2.25rem;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.55rem;
    }

    .calendar-head strong {
      color: var(--white);
      text-align: center;
      font-size: 0.9rem;
    }

    .calendar-nav,
    .calendar-day {
      min-height: 2.2rem;
      padding: 0;
      border-color: rgba(0, 230, 255, 0.18);
      background: rgba(10, 15, 30, 0.62);
      color: var(--cyan);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.28rem;
    }

    .calendar-weekday {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }

    .calendar-day {
      color: var(--text);
      font-size: 0.82rem;
      letter-spacing: 0;
      text-transform: none;
    }

    .calendar-day.active {
      color: var(--deep-navy);
      background: linear-gradient(90deg, var(--cyan), #7AF4FF);
    }

    .calendar-day.outside {
      color: rgba(255, 255, 255, 0.32);
    }

    .booking-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
    }

    .booking-form .wide,
    .booking-form button,
    .notice,
    .status {
      grid-column: 1 / -1;
    }

    .notice,
    .status {
      border: 1px solid rgba(0, 230, 255, 0.18);
      border-radius: 8px;
      padding: 0.7rem;
      color: var(--muted);
      background: rgba(10, 15, 30, 0.48);
    }

    .confirmation {
      display: grid;
      gap: 0.75rem;
      border: 1px solid rgba(106, 240, 182, 0.52);
      border-radius: 8px;
      padding: 1rem;
      background: rgba(106, 240, 182, 0.08);
    }

    .confirmation h2 {
      color: var(--ok);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1rem;
      font-weight: 900;
    }

    .confirmation-details {
      display: grid;
      gap: 0.45rem;
    }

    .confirmation-row {
      display: grid;
      grid-template-columns: 7.5rem minmax(0, 1fr);
      gap: 0.75rem;
      color: var(--text);
      font-size: 0.92rem;
    }

    .confirmation-row span:first-child {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .confirmation-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .confirmation-actions a,
    .confirmation-actions button {
      width: auto;
      min-width: 11rem;
    }

    .confirmation-actions a {
      display: inline-grid;
      place-items: center;
      min-height: 2.75rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.62rem 0.72rem;
      color: var(--cyan);
      background: rgba(10, 15, 30, 0.78);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .status.error {
      border-color: rgba(255, 111, 135, 0.42);
      color: var(--danger);
    }

    .status.ok {
      border-color: rgba(106, 240, 182, 0.42);
      color: var(--ok);
    }

    .hidden { display: none; }

    @media (max-width: 820px) {
      main,
      .booking-form,
      .controls {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <a class="brand" href="/">
        <img src="/assets/logo-badge.png" alt="">
        <span>Mojo AI Summits</span>
      </a>
      <nav>
        <a href="/schedule-admin/">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="panel stack">
      <div>
        <h1 id="bookingTitle">Book time</h1>
        <p id="bookingIntro">Choose a Mojo team member and a confirmed opening.</p>
      </div>
      <div class="team-list" id="team"></div>
    </section>

    <section class="panel stack">
      <div class="controls">
        <label>
          Meeting
          <select id="meetingType"></select>
        </label>
        <label class="date-picker">
          Date
          <input id="date" type="hidden">
          <button class="date-trigger secondary" id="calendarButton" type="button" aria-expanded="false" aria-haspopup="dialog">
            <span id="calendarButtonLabel">Choose a date</span>
          </button>
          <div class="calendar-popover hidden" id="calendarPanel" role="dialog" aria-label="Choose a booking date">
            <div class="calendar-head">
              <button class="calendar-nav secondary" id="prevMonth" type="button" aria-label="Previous month">&lt;</button>
              <strong id="calendarMonth"></strong>
              <button class="calendar-nav secondary" id="nextMonth" type="button" aria-label="Next month">&gt;</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>
        </label>
      </div>

      <div class="notice hidden" id="warning"></div>
      <div class="slots" id="slots"></div>

      <form class="booking-form hidden" id="bookingForm">
        <label class="hidden" aria-hidden="true">
          Website
          <input name="website" tabindex="-1" autocomplete="off">
        </label>
        <label>
          Name
          <input name="guestName" autocomplete="name" required>
        </label>
        <label>
          Email
          <input name="guestEmail" type="email" autocomplete="email" required>
        </label>
        <label class="wide">
          Company
          <input name="company" autocomplete="organization">
        </label>
        <label class="wide">
          Notes
          <textarea name="notes"></textarea>
        </label>
        <button type="submit">Confirm Booking</button>
      </form>

      <div class="confirmation hidden" id="confirmation" aria-live="polite"></div>
      <div class="status hidden" id="status"></div>
    </section>
  </main>

  <script>
    const state = {
      employees: [],
      employee: null,
      meetingType: null,
      slot: null,
      directSlug: "",
      calendarCursor: null,
      confirmedStarts: new Set(),
      confirmation: null
    };

    const teamEl = document.querySelector("#team");
    const bookingTitleEl = document.querySelector("#bookingTitle");
    const bookingIntroEl = document.querySelector("#bookingIntro");
    const meetingTypeEl = document.querySelector("#meetingType");
    const dateEl = document.querySelector("#date");
    const calendarButton = document.querySelector("#calendarButton");
    const calendarButtonLabel = document.querySelector("#calendarButtonLabel");
    const calendarPanel = document.querySelector("#calendarPanel");
    const calendarMonth = document.querySelector("#calendarMonth");
    const calendarGrid = document.querySelector("#calendarGrid");
    const prevMonth = document.querySelector("#prevMonth");
    const nextMonth = document.querySelector("#nextMonth");
    const slotsEl = document.querySelector("#slots");
    const warningEl = document.querySelector("#warning");
    const statusEl = document.querySelector("#status");
    const bookingForm = document.querySelector("#bookingForm");
    const confirmationEl = document.querySelector("#confirmation");

    function setStatus(message, kind = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${kind}`.trim();
      statusEl.classList.toggle("hidden", !message);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function clearConfirmation() {
      state.confirmation = null;
      confirmationEl.classList.add("hidden");
      confirmationEl.innerHTML = "";
    }

    function formatBookingRange(booking) {
      const start = new Date(booking.start);
      const end = new Date(booking.end);
      const timezone = booking.timezone || state.employee?.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone;
      const date = new Intl.DateTimeFormat("en-US", {
        timeZone: timezone,
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      }).format(start);
      const time = `${new Intl.DateTimeFormat("en-US", {
        timeZone: timezone,
        hour: "numeric",
        minute: "2-digit"
      }).format(start)} - ${new Intl.DateTimeFormat("en-US", {
        timeZone: timezone,
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short"
      }).format(end)}`;
      return { date, time };
    }

    function renderConfirmation(booking) {
      state.confirmation = booking;
      const { date, time } = formatBookingRange(booking);
      const employeeName = booking.employee?.name || state.employee?.name || "Mojo AI Summits";
      const meetingLabel = booking.meetingType?.label || state.meetingType?.label || "Meeting";
      const location = booking.onlineMeetingUrl ? "Zoom link included" : booking.meetingType?.location || "Zoom";
      confirmationEl.innerHTML = `
        <h2>Event booked.</h2>
        <p>The calendar invitation is on its way.</p>
        <div class="confirmation-details">
          <div class="confirmation-row"><span>Meeting</span><strong>${escapeHtml(meetingLabel)}</strong></div>
          <div class="confirmation-row"><span>Host</span><strong>${escapeHtml(employeeName)}</strong></div>
          <div class="confirmation-row"><span>Date</span><strong>${escapeHtml(date)}</strong></div>
          <div class="confirmation-row"><span>Time</span><strong>${escapeHtml(time)}</strong></div>
          <div class="confirmation-row"><span>Location</span><strong>${escapeHtml(location)}</strong></div>
        </div>
        <div class="confirmation-actions">
          ${booking.onlineMeetingUrl ? `<a href="${escapeHtml(booking.onlineMeetingUrl)}" target="_blank" rel="noopener">Open Zoom</a>` : ""}
          <button class="secondary" id="bookAnotherTime" type="button">Book Another Time</button>
        </div>
      `;
      confirmationEl.classList.remove("hidden");
      confirmationEl.querySelector("#bookAnotherTime")?.addEventListener("click", () => {
        clearConfirmation();
        loadAvailability().catch((error) => setStatus(error.message, "error"));
      });
    }

    function todayValue() {
      return new Date().toISOString().slice(0, 10);
    }

    function directBookingSlug() {
      const directMatch = window.location.pathname.match(/^\/book-([a-z0-9-]+)\/?$/i);
      if (directMatch) return directMatch[1].toLowerCase();
      const queryHost = new URLSearchParams(window.location.search).get("host");
      return String(queryHost || "").trim().toLowerCase();
    }

    function updateBookingCopy() {
      if (state.directSlug && state.employee) {
        bookingTitleEl.textContent = `Book ${state.employee.name}`;
        bookingIntroEl.textContent = "Choose a confirmed opening for this team member.";
        document.title = `Book ${state.employee.name} - Mojo AI Summits`;
        return;
      }
      bookingTitleEl.textContent = "Book time";
      bookingIntroEl.textContent = "Choose a Mojo team member and a confirmed opening.";
      document.title = "Book Mojo AI Summits";
    }

    function dateFromValue(value) {
      const [year, month, day] = String(value || "").split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function dateValue(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function addMonths(date, amount) {
      return new Date(date.getFullYear(), date.getMonth() + amount, 1);
    }

    function formatDateLabel(value) {
      return dateFromValue(value).toLocaleDateString("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    }

    function maxDateValue() {
      const daysAhead = Number(state.employee?.maxDaysAhead || 45);
      const maxDate = dateFromValue(todayValue());
      maxDate.setDate(maxDate.getDate() + Math.max(1, daysAhead));
      return dateValue(maxDate);
    }

    function setCalendarOpen(open) {
      calendarPanel.classList.toggle("hidden", !open);
      calendarButton.setAttribute("aria-expanded", String(open));
    }

    function setSelectedDate(value, shouldLoad = true) {
      dateEl.value = value;
      calendarButtonLabel.textContent = formatDateLabel(value);
      state.calendarCursor = new Date(dateFromValue(value).getFullYear(), dateFromValue(value).getMonth(), 1);
      renderCalendar();
      if (shouldLoad) {
        clearConfirmation();
        loadAvailability().catch((error) => setStatus(error.message, "error"));
      }
    }

    function renderCalendar() {
      const selected = dateEl.value || todayValue();
      const today = todayValue();
      const max = maxDateValue();
      const cursor = state.calendarCursor || new Date(dateFromValue(selected).getFullYear(), dateFromValue(selected).getMonth(), 1);
      const monthStart = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
      const gridStart = new Date(monthStart);
      gridStart.setDate(monthStart.getDate() - monthStart.getDay());

      calendarMonth.textContent = monthStart.toLocaleDateString("en-US", { month: "long", year: "numeric" });
      calendarGrid.innerHTML = "";
      ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach((day) => {
        const label = document.createElement("div");
        label.className = "calendar-weekday";
        label.textContent = day;
        calendarGrid.append(label);
      });

      for (let index = 0; index < 42; index += 1) {
        const day = new Date(gridStart);
        day.setDate(gridStart.getDate() + index);
        const value = dateValue(day);
        const button = document.createElement("button");
        button.type = "button";
        button.className = [
          "calendar-day",
          "secondary",
          day.getMonth() !== monthStart.getMonth() ? "outside" : "",
          value === selected ? "active" : ""
        ].filter(Boolean).join(" ");
        button.textContent = String(day.getDate());
        button.disabled = value < today || value > max;
        button.setAttribute("aria-label", formatDateLabel(value));
        button.addEventListener("click", () => {
          setCalendarOpen(false);
          setSelectedDate(value);
        });
        calendarGrid.append(button);
      }

      prevMonth.disabled = dateValue(monthStart) <= today.slice(0, 8) + "01";
      nextMonth.disabled = dateValue(addMonths(monthStart, 1)) > max;
    }

    function renderTeam() {
      teamEl.innerHTML = "";
      if (!state.employees.length) {
        teamEl.innerHTML = state.directSlug
          ? '<div class="notice">This booking profile is not available.</div>'
          : '<div class="notice">No bookable team profiles yet.</div>';
        updateBookingCopy();
        return;
      }

      state.employees.forEach((employee) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `person secondary ${state.employee?.slug === employee.slug ? "active" : ""}`;
        const avatar = employee.photoUrl ? document.createElement("img") : document.createElement("span");
        avatar.className = "avatar";
        if (employee.photoUrl) {
          avatar.src = employee.photoUrl;
          avatar.alt = "";
        } else {
          avatar.textContent = (employee.name || "?").slice(0, 1).toUpperCase();
        }
        const copy = document.createElement("span");
        copy.className = "person-copy";
        const name = document.createElement("strong");
        name.textContent = employee.name;
        const title = document.createElement("span");
        title.className = "meta";
        title.textContent = employee.title || "";
        copy.append(name, title);
        button.append(avatar, copy);
        button.addEventListener("click", () => selectEmployee(employee.slug));
        teamEl.append(button);
      });
    }

    function renderMeetingTypes() {
      meetingTypeEl.innerHTML = "";
      const types = state.employee?.meetingTypes || [];
      types.forEach((type) => {
        const option = document.createElement("option");
        option.value = type.id;
        option.textContent = `${type.label} (${type.durationMinutes} min)`;
        meetingTypeEl.append(option);
      });
      state.meetingType = types[0] || null;
    }

    function selectEmployee(slug) {
      if (state.directSlug && slug !== state.directSlug) return;
      state.employee = state.employees.find((employee) => employee.slug === slug) || null;
      state.slot = null;
      clearConfirmation();
      renderTeam();
      renderMeetingTypes();
      updateBookingCopy();
      loadAvailability();
    }

    function visibleSlots(slots) {
      return (slots || []).filter((slot) => !state.confirmedStarts.has(slot.start));
    }

    function renderSlots(slots) {
      slots = visibleSlots(slots);
      slotsEl.innerHTML = "";
      bookingForm.classList.add("hidden");
      if (!slots.length) {
        slotsEl.innerHTML = '<div class="notice">No openings for this date.</div>';
        return;
      }

      slots.forEach((slot) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `slot secondary ${state.slot?.start === slot.start ? "active" : ""}`;
        button.innerHTML = `<strong>${slot.label}</strong>`;
        button.addEventListener("click", () => {
          state.slot = slot;
          renderSlots(slots);
          bookingForm.classList.remove("hidden");
          setStatus("");
        });
        slotsEl.append(button);
      });
    }

    async function loadTeam() {
      setStatus("");
      const response = await fetch("/api/scheduling/team", { cache: "no-store" });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "Unable to load team.");
      const allEmployees = payload.employees || [];
      state.directSlug = directBookingSlug();
      state.employees = state.directSlug
        ? allEmployees.filter((employee) => employee.slug === state.directSlug)
        : allEmployees;
      state.employee = state.employees[0] || null;
      renderTeam();
      renderMeetingTypes();
      updateBookingCopy();
      if (state.employee) await loadAvailability();
    }

    async function loadAvailability() {
      state.slot = null;
      clearConfirmation();
      setStatus("");
      warningEl.classList.add("hidden");
      bookingForm.classList.add("hidden");
      slotsEl.innerHTML = '<div class="notice">Checking availability...</div>';

      if (!state.employee || !state.meetingType || !dateEl.value) {
        slotsEl.innerHTML = "";
        return;
      }

      const params = new URLSearchParams({
        host: state.employee.slug,
        type: meetingTypeEl.value,
        date: dateEl.value
      });
      const response = await fetch(`/api/scheduling/availability?${params}`, { cache: "no-store" });
      const payload = await response.json();
      if (!response.ok) {
        slotsEl.innerHTML = "";
        throw new Error(payload.error || "Unable to load availability.");
      }

      if (payload.warning) {
        warningEl.textContent = payload.warning;
        warningEl.classList.remove("hidden");
      }
      renderSlots(payload.slots || []);
    }

    meetingTypeEl.addEventListener("change", () => {
      state.meetingType = state.employee?.meetingTypes?.find((type) => type.id === meetingTypeEl.value) || null;
      loadAvailability().catch((error) => setStatus(error.message, "error"));
    });

    calendarButton.addEventListener("click", () => {
      setCalendarOpen(calendarPanel.classList.contains("hidden"));
    });

    prevMonth.addEventListener("click", () => {
      state.calendarCursor = addMonths(state.calendarCursor || dateFromValue(dateEl.value || todayValue()), -1);
      renderCalendar();
    });

    nextMonth.addEventListener("click", () => {
      state.calendarCursor = addMonths(state.calendarCursor || dateFromValue(dateEl.value || todayValue()), 1);
      renderCalendar();
    });

    document.addEventListener("click", (event) => {
      if (!calendarPanel.classList.contains("hidden") && !event.target.closest(".date-picker")) {
        setCalendarOpen(false);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setCalendarOpen(false);
    });

    bookingForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!state.employee || !state.meetingType || !state.slot) return;

      const button = bookingForm.querySelector("button");
      button.disabled = true;
      setStatus("Confirming booking...");

      const form = new FormData(bookingForm);
      const response = await fetch("/api/scheduling/book", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          host: state.employee.slug,
          type: state.meetingType.id,
          start: state.slot.start,
          guestName: form.get("guestName"),
          guestEmail: form.get("guestEmail"),
          company: form.get("company"),
          notes: form.get("notes"),
          website: form.get("website")
        })
      });
      const payload = await response.json().catch(() => ({}));
      button.disabled = false;

      if (!response.ok) {
        setStatus(payload.error || "Unable to confirm booking.", "error");
        await loadAvailability().catch(() => null);
        return;
      }

      bookingForm.reset();
      bookingForm.classList.add("hidden");
      const booking = payload.booking || {};
      state.confirmedStarts.add(booking.start || state.slot.start);
      state.slot = null;
      slotsEl.innerHTML = "";
      warningEl.classList.add("hidden");
      setStatus("");
      renderConfirmation(booking);
    });

    setSelectedDate(todayValue(), false);
    loadTeam().catch((error) => setStatus(error.message, "error"));
  </script>
<link rel="stylesheet" href="/assets/mojo-brand-compliance.css" data-brand-compliance-final>
</body>
