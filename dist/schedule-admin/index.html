<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/logo-badge.png">
  <link rel="apple-touch-icon" href="/assets/logo-badge.png">
  <title>Mojo Scheduling Admin</title>
  <style>
    :root {
      --deep-navy: #0A0F1E;
      --electric-blue: #1666FF;
      --cyan: #00E6FF;
      --slate: #1B2333;
      --white: #FFFFFF;
      --text: #F3FAFF;
      --muted: rgba(255, 255, 255, 0.68);
      --line: rgba(0, 230, 255, 0.24);
      --danger: #FF6F87;
      --ok: #6AF0B6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(22, 102, 255, 0.22), transparent 30rem),
        linear-gradient(180deg, #050814 0%, var(--deep-navy) 48%, #07101F 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: rgba(10, 15, 30, 0.88);
      backdrop-filter: blur(16px);
    }

    .topbar,
    main {
      width: min(1040px, calc(100% - 1.5rem));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 0;
    }

    .brand,
    nav a {
      color: var(--cyan);
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main {
      display: grid;
      grid-template-columns: minmax(220px, 0.55fr) minmax(0, 1.45fr);
      align-items: start;
      gap: 0.75rem;
      padding: 1rem 0 2rem;
    }

    section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(27, 35, 51, 0.94), rgba(10, 15, 30, 0.82)),
        var(--slate);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .panel {
      padding: 1rem;
    }

    h1,
    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      letter-spacing: 0;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      line-height: 1;
      margin-bottom: 0.45rem;
    }

    h2 { font-size: 1.15rem; }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    label {
      display: grid;
      gap: 0.45rem;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field-label {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.62rem 0.72rem;
      color: var(--text);
      background: rgba(10, 15, 30, 0.78);
      font: inherit;
      letter-spacing: 0;
    }

    .hidden-field {
      display: none;
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      color: var(--deep-navy);
      border-color: transparent;
      background: linear-gradient(90deg, var(--cyan), #7AF4FF);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    button.secondary {
      color: var(--cyan);
      border-color: var(--line);
      background: rgba(10, 15, 30, 0.78);
    }

    .stack { display: grid; gap: 0.75rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
    }

    .wide,
    .status {
      grid-column: 1 / -1;
    }

    .employee-list {
      display: grid;
      gap: 0.5rem;
    }

    .employee {
      border: 1px solid rgba(0, 230, 255, 0.18);
      border-radius: 8px;
      padding: 0.62rem 0.72rem;
      background: rgba(10, 15, 30, 0.54);
      text-align: left;
    }

    .employee.active {
      border-color: var(--cyan);
      box-shadow: 0 0 0 1px rgba(0, 230, 255, 0.2);
    }

    .connection-list {
      display: grid;
      gap: 0.45rem;
    }

    .build-stamp,
    .connection-heading {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .connection {
      border: 1px solid rgba(0, 230, 255, 0.18);
      border-radius: 8px;
      padding: 0.62rem 0.72rem;
      color: var(--muted);
      background: rgba(10, 15, 30, 0.48);
      font-size: 0.9rem;
    }

    .connection-row {
      display: grid;
      grid-template-columns: minmax(150px, 0.9fr) minmax(180px, 1.2fr) minmax(100px, 0.55fr);
      align-items: center;
      gap: 0.5rem;
    }

    .connection-heading {
      padding: 0 0.72rem;
    }

    .connection-row input {
      min-width: 0;
    }

    .connection-row code {
      color: var(--cyan);
      font-size: 0.78rem;
      overflow-wrap: anywhere;
    }

    .connection-row button {
      padding: 0.48rem 0.55rem;
      font-size: 0.72rem;
    }

    .booking-link-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(5.5rem, auto);
      gap: 0.45rem;
    }

    .booking-link-row a {
      display: inline-grid;
      place-items: center;
      min-height: 2.72rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--cyan);
      background: rgba(10, 15, 30, 0.78);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .status {
      border: 1px solid rgba(0, 230, 255, 0.18);
      border-radius: 8px;
      padding: 0.7rem;
      color: var(--muted);
      background: rgba(10, 15, 30, 0.48);
    }

    .status.error {
      border-color: rgba(255, 111, 135, 0.42);
      color: var(--danger);
    }

    .status.ok {
      border-color: rgba(106, 240, 182, 0.42);
      color: var(--ok);
    }

    @media (max-width: 860px) {
      main,
      .grid {
        grid-template-columns: 1fr;
      }

      .connection-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <a class="brand" href="/">Mojo AI Summits</a>
      <nav><a href="/book/">Booking</a></nav>
    </div>
  </header>

  <main>
    <section class="panel stack">
      <div>
        <h1>Scheduling</h1>
        <p id="graphStatus">Checking calendar connection...</p>
        <p class="build-stamp" id="buildStamp">Build 2026.07.31.7-json-errors</p>
      </div>
      <div class="employee-list" id="employees"></div>
      <button type="button" class="secondary" id="newEmployee">New Profile</button>
    </section>

    <section class="panel stack">
      <h2>Employee Profile</h2>
      <form class="grid" id="profileForm">
        <label>
          Slug
          <input name="slug" placeholder="gina">
        </label>
        <label>
          Booking Link
          <span class="booking-link-row">
            <input name="bookingUrl" readonly>
            <a id="bookingUrlOpen" href="/book/" target="_blank" rel="noopener">Open</a>
          </span>
        </label>
        <label>
          Active
          <select name="active">
            <option value="true">Active</option>
            <option value="false">Inactive</option>
          </select>
        </label>
        <label>
          Name
          <input name="name" required>
        </label>
        <label>
          Calendar Email
          <input name="email" type="email" required>
        </label>
        <label>
          Profile Photo URL
          <input name="photoUrl" placeholder="/assets/images/scott-pro3-6.png">
        </label>
        <label class="wide">
          Same-Tenant Busy Emails
          <input name="busyCalendarEmails" placeholder="other@mojoaisummits.com, second@mojoaisummits.com">
        </label>
        <label class="wide">
          Blind Calendar Invite Emails
          <input name="mirrorInviteEmails" placeholder="sschindler@cmcenters.org">
        </label>
        <div class="wide stack">
          <div class="field-label">External Microsoft Calendar Read Connections</div>
          <textarea class="hidden-field" name="authenticatedCalendarEmails"></textarea>
          <div class="connection-list" id="microsoftCalendarRows"></div>
          <button type="button" class="secondary" id="addMicrosoftReadConnection">Add Microsoft Read Connection</button>
        </div>
        <div class="wide stack">
          <div class="field-label">Published Calendar Feed URLs</div>
          <textarea class="hidden-field" name="busyCalendarUrls"></textarea>
          <div class="connection-list" id="calendarFeedRows"></div>
          <button type="button" class="secondary" id="addCalendarFeedUrl">Add Feed URL</button>
        </div>
        <label>
          Title
          <input name="title">
        </label>
        <label>
          Timezone
          <input name="timezone" value="America/Denver">
        </label>
        <label>
          Day Start
          <input name="dayStart" type="time" value="09:00">
        </label>
        <label>
          Day End
          <input name="dayEnd" type="time" value="17:00">
        </label>
        <label>
          Slot Step
          <input name="slotStepMinutes" type="number" min="5" max="120" value="30">
        </label>
        <label>
          Buffer After
          <input name="bufferAfterMinutes" type="number" min="0" max="240" value="15">
        </label>
        <label>
          Min Notice Hours
          <input name="minNoticeHours" type="number" min="0" max="720" value="4">
        </label>
        <label>
          Max Days Ahead
          <input name="maxDaysAhead" type="number" min="1" max="365" value="45">
        </label>
        <label>
          Meeting Label
          <input name="meetingLabel" value="Intro call">
        </label>
        <label>
          Duration
          <input name="durationMinutes" type="number" min="15" max="240" value="30">
        </label>
        <label class="wide">
          Bio
          <textarea name="bio"></textarea>
        </label>
        <label class="wide">
          Meeting Description
          <textarea name="meetingDescription">A focused conversation with the Mojo team.</textarea>
        </label>
        <button type="submit">Save Profile</button>
        <div class="status" id="status"></div>
      </form>
    </section>
  </main>

  <script>
    const SCHEDULING_ADMIN_BUILD = "2026.07.31.9-zoom";
    const employeesEl = document.querySelector("#employees");
    const graphStatusEl = document.querySelector("#graphStatus");
    const buildStampEl = document.querySelector("#buildStamp");
    const form = document.querySelector("#profileForm");
    const statusEl = document.querySelector("#status");
    const newEmployeeButton = document.querySelector("#newEmployee");
    const addMicrosoftReadConnectionButton = document.querySelector("#addMicrosoftReadConnection");
    const addCalendarFeedUrlButton = document.querySelector("#addCalendarFeedUrl");
    const microsoftCalendarRowsEl = document.querySelector("#microsoftCalendarRows");
    const calendarFeedRowsEl = document.querySelector("#calendarFeedRows");
    const bookingUrlOpenEl = document.querySelector("#bookingUrlOpen");
    let employees = [];
    let selectedSlug = "";
    let authEmailDrafts = [""];
    let feedUrlDrafts = [""];

    if (buildStampEl) {
      buildStampEl.textContent = `Build ${SCHEDULING_ADMIN_BUILD} · JS ready`;
    }

    function setStatus(message, kind = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${kind}`.trim();
    }

    async function readApiPayload(response, fallbackMessage) {
      const contentType = response.headers.get("content-type") || "";
      const text = await response.text().catch(() => "");
      const trimmed = text.trim();
      if (/^<!doctype/i.test(trimmed) || /<html/i.test(trimmed)) {
        return {
          error: response.ok
            ? "Scheduling admin returned a web page instead of data. Refresh and sign in through Access again."
            : `Sign in with an approved Mojo AI Summits account to use scheduling admin. The admin API returned ${response.status} ${contentType || "without a content type"}.`
        };
      }

      if (!trimmed) return { error: fallbackMessage };

      try {
        return JSON.parse(trimmed);
      } catch {
        return { error: `${fallbackMessage} The admin API returned ${response.status} ${contentType || "without a content type"}.` };
      }
    }

    function field(name) {
      return form.elements[name];
    }

    function selectedEmployee() {
      return employees.find((item) => item.slug === selectedSlug) || null;
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
    }

    function emailListFromText(value) {
      return [...new Set(String(value || "")
        .split(/[\s,;]+/)
        .map((email) => email.trim().toLowerCase())
        .filter(isValidEmail))];
    }

    function isValidCalendarFeedUrl(url) {
      const value = String(url || "").trim();
      if (!value) return false;
      try {
        const parsed = new URL(value.replace(/^webcal:/i, "https:"));
        return ["https:", "http:"].includes(parsed.protocol);
      } catch {
        return false;
      }
    }

    function cleanCalendarFeedDraft(url) {
      return String(url || "").trim();
    }

    function authUrlFor(slug, email) {
      return new URL(`/api/scheduling/oauth/start?slug=${encodeURIComponent(slug)}&email=${encodeURIComponent(email)}`, window.location.origin).toString();
    }

    function bookingPathForSlug(slug) {
      const cleanSlug = String(slug || "").trim().toLowerCase().replace(/[^a-z0-9-]/g, "");
      return cleanSlug ? `/book-${cleanSlug}/` : "/book/";
    }

    function bookingUrlForSlug(slug) {
      return new URL(bookingPathForSlug(slug), window.location.origin).toString();
    }

    function refreshBookingLink() {
      const url = bookingUrlForSlug(field("slug").value);
      field("bookingUrl").value = url;
      bookingUrlOpenEl.href = url;
    }

    function syncAuthenticatedCalendarField() {
      field("authenticatedCalendarEmails").value = emailListFromText(authEmailDrafts.join("\n")).join("\n");
    }

    function syncCalendarFeedField() {
      field("busyCalendarUrls").value = [...new Set(feedUrlDrafts.map(cleanCalendarFeedDraft).filter(Boolean))].join("\n");
    }

    function syncExternalCalendarFields() {
      syncAuthenticatedCalendarField();
      syncCalendarFeedField();
    }

    function renderEmployees() {
      employeesEl.innerHTML = "";
      if (!employees.length) {
        employeesEl.innerHTML = '<p>No profiles saved.</p>';
        return;
      }

      employees.forEach((employee) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `employee secondary ${employee.slug === selectedSlug ? "active" : ""}`;
        button.textContent = `${employee.name} · ${employee.email}`;
        button.addEventListener("click", () => loadEmployee(employee.slug));
        employeesEl.append(button);
      });
    }

    function renderMicrosoftConnections(employee = selectedEmployee()) {
      microsoftCalendarRowsEl.innerHTML = "";
      const connections = new Map((employee?.connectedCalendars || []).map((connection) => [
        String(connection.expectedEmail || connection.email || "").toLowerCase(),
        connection
      ]));
      const rowEmails = authEmailDrafts.map((email) => String(email || "").trim().toLowerCase());
      const seenEmails = new Set(rowEmails.filter(Boolean));
      [...(employee?.authenticatedCalendarEmails || []), ...connections.keys()].forEach((email) => {
        const normalizedEmail = String(email || "").trim().toLowerCase();
        if (normalizedEmail && !seenEmails.has(normalizedEmail)) {
          rowEmails.push(normalizedEmail);
          seenEmails.add(normalizedEmail);
        }
      });
      authEmailDrafts = rowEmails.length ? rowEmails : [""];
      syncAuthenticatedCalendarField();

      const header = document.createElement("div");
      header.className = "connection-row connection-heading";
      ["Email", "Read Authentication URL", "Action"].forEach((label) => {
        const item = document.createElement("span");
        item.textContent = label;
        header.append(item);
      });
      microsoftCalendarRowsEl.append(header);

      authEmailDrafts.forEach((email, index) => {
        const slug = field("slug").value || employee?.slug || selectedSlug;
        const item = document.createElement("div");
        item.className = "connection connection-row";
        const emailEl = document.createElement("input");
        emailEl.type = "email";
        emailEl.placeholder = "email@domain.com";
        emailEl.value = email;
        const urlEl = document.createElement("code");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "secondary";

        const updateRow = () => {
          const normalizedEmail = emailEl.value.trim().toLowerCase();
          authEmailDrafts[index] = normalizedEmail;
          syncAuthenticatedCalendarField();
          const valid = isValidEmail(normalizedEmail);
          const authUrl = valid && slug ? authUrlFor(slug, normalizedEmail) : "";
          urlEl.textContent = authUrl || "Enter an email to generate the read URL.";
          button.textContent = connections.has(normalizedEmail) ? "Reconnect" : "Connect";
          button.disabled = !slug || !valid;
        };

        emailEl.addEventListener("input", updateRow);
        button.addEventListener("click", () => {
          const normalizedEmail = emailEl.value.trim().toLowerCase();
          if (!slug) {
            setStatus("Save or select a profile before connecting a calendar.", "error");
            return;
          }
          if (!isValidEmail(normalizedEmail)) {
            setStatus("Enter a valid calendar email before connecting.", "error");
            return;
          }
          window.open(authUrlFor(slug, normalizedEmail), "_blank", "noopener,noreferrer");
        });
        updateRow();
        item.append(emailEl, urlEl, button);
        microsoftCalendarRowsEl.append(item);
      });
    }

    function renderCalendarFeeds(employee = selectedEmployee()) {
      calendarFeedRowsEl.innerHTML = "";
      const rowUrls = feedUrlDrafts.map(cleanCalendarFeedDraft);
      const seenUrls = new Set(rowUrls.filter(Boolean));
      (employee?.busyCalendarUrls || []).forEach((url) => {
        const normalizedUrl = cleanCalendarFeedDraft(url);
        if (normalizedUrl && !seenUrls.has(normalizedUrl)) {
          rowUrls.push(normalizedUrl);
          seenUrls.add(normalizedUrl);
        }
      });
      feedUrlDrafts = rowUrls.length ? rowUrls : [""];
      syncCalendarFeedField();

      const header = document.createElement("div");
      header.className = "connection-row connection-heading";
      ["Calendar Feed URL", "Read Mode", "Action"].forEach((label) => {
        const item = document.createElement("span");
        item.textContent = label;
        header.append(item);
      });
      calendarFeedRowsEl.append(header);

      feedUrlDrafts.forEach((url, index) => {
        const item = document.createElement("div");
        item.className = "connection connection-row";
        const urlInput = document.createElement("input");
        urlInput.type = "url";
        urlInput.placeholder = "https://.../calendar.ics or webcal://...";
        urlInput.value = url;
        const modeEl = document.createElement("code");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "secondary";
        button.textContent = "Remove";

        const updateRow = () => {
          feedUrlDrafts[index] = cleanCalendarFeedDraft(urlInput.value);
          syncCalendarFeedField();
          modeEl.textContent = isValidCalendarFeedUrl(feedUrlDrafts[index])
            ? "Read busy times only"
            : "Enter a published iCalendar feed URL.";
        };

        urlInput.addEventListener("input", updateRow);
        button.addEventListener("click", () => {
          feedUrlDrafts.splice(index, 1);
          if (!feedUrlDrafts.length) feedUrlDrafts = [""];
          renderCalendarFeeds(selectedEmployee());
        });
        updateRow();
        item.append(urlInput, modeEl, button);
        calendarFeedRowsEl.append(item);
      });
    }

    function renderExternalCalendars(employee = selectedEmployee()) {
      renderMicrosoftConnections(employee);
      renderCalendarFeeds(employee);
    }

    function resetForm() {
      selectedSlug = "";
      form.reset();
      field("active").value = "true";
      field("timezone").value = "America/Denver";
      field("dayStart").value = "09:00";
      field("dayEnd").value = "17:00";
      field("slotStepMinutes").value = "30";
      field("bufferAfterMinutes").value = "15";
      field("minNoticeHours").value = "4";
      field("maxDaysAhead").value = "45";
      field("photoUrl").value = "";
      refreshBookingLink();
      field("busyCalendarEmails").value = "";
      field("mirrorInviteEmails").value = "";
      authEmailDrafts = [""];
      feedUrlDrafts = [""];
      syncExternalCalendarFields();
      field("meetingLabel").value = "Intro call";
      field("durationMinutes").value = "30";
      field("meetingDescription").value = "A focused conversation with the Mojo team.";
      renderExternalCalendars(null);
      renderEmployees();
      setStatus("");
    }

    function loadEmployee(slug) {
      const employee = employees.find((item) => item.slug === slug);
      if (!employee) return;
      selectedSlug = employee.slug;
      field("slug").value = employee.slug;
      refreshBookingLink();
      field("active").value = employee.active === false ? "false" : "true";
      field("name").value = employee.name || "";
      field("email").value = employee.email || "";
      field("photoUrl").value = employee.photoUrl || "";
      field("busyCalendarEmails").value = (employee.busyCalendarEmails || []).join(", ");
      field("mirrorInviteEmails").value = (employee.mirrorInviteEmails || []).join(", ");
      authEmailDrafts = [...new Set([
        ...(employee.authenticatedCalendarEmails || []),
        ...(employee.connectedCalendars || []).map((connection) => connection.expectedEmail || connection.email).filter(Boolean)
      ].map((email) => String(email).toLowerCase()))];
      if (!authEmailDrafts.length) authEmailDrafts = [""];
      syncAuthenticatedCalendarField();
      feedUrlDrafts = (employee.busyCalendarUrls || []).length ? [...employee.busyCalendarUrls] : [""];
      syncCalendarFeedField();
      field("title").value = employee.title || "";
      field("timezone").value = employee.timezone || "America/Denver";
      field("dayStart").value = employee.dayStart || "09:00";
      field("dayEnd").value = employee.dayEnd || "17:00";
      field("slotStepMinutes").value = employee.slotStepMinutes || 30;
      field("bufferAfterMinutes").value = employee.bufferAfterMinutes || 15;
      field("minNoticeHours").value = employee.minNoticeHours || 4;
      field("maxDaysAhead").value = employee.maxDaysAhead || 45;
      field("bio").value = employee.bio || "";
      const type = employee.meetingTypes?.[0] || {};
      field("meetingLabel").value = type.label || "Intro call";
      field("durationMinutes").value = type.durationMinutes || 30;
      field("meetingDescription").value = type.description || "A focused conversation with the Mojo team.";
      renderExternalCalendars(employee);
      renderEmployees();
      setStatus("");
    }

    async function loadAdmin() {
      const response = await fetch(`/api/scheduling/admin?build=${encodeURIComponent(SCHEDULING_ADMIN_BUILD)}`, {
        cache: "no-store",
        headers: { accept: "application/json" }
      });
      const payload = await readApiPayload(response, "Unable to load scheduling admin.");
      if (!response.ok) throw new Error(payload.error || "Unable to load scheduling admin.");
      employees = payload.employees || [];
      graphStatusEl.textContent = payload.graphConfigured
        ? "Microsoft Graph is configured."
        : "Microsoft Graph credentials are not configured yet.";
      renderEmployees();
      if (employees[0]) loadEmployee(employees[0].slug);
    }

    field("slug").addEventListener("input", refreshBookingLink);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("Saving...");
      syncExternalCalendarFields();

      const body = {
        slug: field("slug").value,
        active: field("active").value === "true",
        name: field("name").value,
        email: field("email").value,
        photoUrl: field("photoUrl").value,
        busyCalendarEmails: field("busyCalendarEmails").value,
        mirrorInviteEmails: field("mirrorInviteEmails").value,
        authenticatedCalendarEmails: field("authenticatedCalendarEmails").value,
        busyCalendarUrls: field("busyCalendarUrls").value,
        title: field("title").value,
        timezone: field("timezone").value,
        dayStart: field("dayStart").value,
        dayEnd: field("dayEnd").value,
        slotStepMinutes: Number(field("slotStepMinutes").value),
        bufferAfterMinutes: Number(field("bufferAfterMinutes").value),
        minNoticeHours: Number(field("minNoticeHours").value),
        maxDaysAhead: Number(field("maxDaysAhead").value),
        bio: field("bio").value,
        meetingTypes: [{
          id: "intro",
          label: field("meetingLabel").value,
          durationMinutes: Number(field("durationMinutes").value),
          description: field("meetingDescription").value,
          location: "Zoom"
        }]
      };

      const response = await fetch(`/api/scheduling/admin?build=${encodeURIComponent(SCHEDULING_ADMIN_BUILD)}`, {
        method: "POST",
        headers: { accept: "application/json", "content-type": "application/json" },
        body: JSON.stringify(body)
      });
      const payload = await readApiPayload(response, "Unable to save profile.");
      if (!response.ok) {
        setStatus(payload.error || "Unable to save profile.", "error");
        return;
      }

      setStatus("Saved.", "ok");
      await loadAdmin();
      loadEmployee(payload.employee.slug);
    });

    newEmployeeButton.addEventListener("click", resetForm);
    addMicrosoftReadConnectionButton.addEventListener("click", () => {
      authEmailDrafts.push("");
      renderExternalCalendars(selectedEmployee());
    });
    addCalendarFeedUrlButton.addEventListener("click", () => {
      feedUrlDrafts.push("");
      renderExternalCalendars(selectedEmployee());
    });

    const calendarStatus = new URLSearchParams(window.location.search).get("calendar");
    const expectedCalendar = new URLSearchParams(window.location.search).get("expected");
    const actualCalendar = new URLSearchParams(window.location.search).get("actual");

    loadAdmin()
      .then(() => {
        if (calendarStatus === "connected") setStatus("Authenticated calendar connected.", "ok");
        if (calendarStatus === "expired") setStatus("Calendar connection expired before Microsoft returned. Try again.", "error");
        if (calendarStatus === "denied") setStatus("Calendar connection was cancelled.", "error");
        if (calendarStatus === "mismatch") setStatus(`Microsoft returned ${actualCalendar || "a different account"} instead of ${expectedCalendar || "the requested account"}.`, "error");
      })
      .catch((error) => {
        graphStatusEl.textContent = error.message;
        setStatus(error.message, "error");
      });
  </script>
</body>
</html>
