<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Executive Intelligence for the AI Era by MOJO AI Summits</title>
  <desc id="desc">A deep navy MOJO AI Summits social preview graphic with cyan and electric blue accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="0.58" stop-color="#10192c"/>
      <stop offset="1" stop-color="#0A0F1E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1666FF"/>
      <stop offset="1" stop-color="#00E6FF"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { font-family: "Space Grotesk", "Inter", Arial, sans-serif; font-weight: 700; letter-spacing: 0.11em; }
      .headline { font-family: Georgia, "Times New Roman", serif; font-weight: 600; }
      .italic { font-style: italic; fill: #b9c0d2; }
      .small { font-family: "Inter", Arial, sans-serif; letter-spacing: 0.015em; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="890" cy="220" rx="390" ry="270" fill="#1666FF" opacity="0.13" filter="url(#softGlow)"/>
  <g fill="none" stroke="#00E6FF" stroke-width="1.2" opacity="0.26">
    <path d="M80 92 C285 55 520 100 710 119 C880 136 1010 130 1122 88"/>
    <path d="M80 134 C300 82 535 127 735 151 C900 170 1024 163 1122 120"/>
    <path d="M80 184 C315 120 552 163 760 190 C925 213 1035 205 1122 162"/>
    <path d="M80 244 C318 169 567 207 790 239 C948 262 1052 252 1122 216"/>
    <path d="M80 324 C332 243 590 276 814 314 C956 338 1060 327 1122 292"/>
    <path d="M80 400 C326 310 594 345 836 386 C970 408 1060 397 1122 364"/>
  </g>
  <path d="M80 91 H360" stroke="#00E6FF" stroke-width="2.4"/>
  <path d="M80 540 H1120" stroke="url(#accent)" stroke-width="2.4"/>

  <g transform="translate(90 145)">
    <circle cx="55" cy="55" r="50" fill="#0A0F1E" stroke="#00E6FF" stroke-width="2.5"/>
    <circle cx="55" cy="55" r="42" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8"/>
    <text x="55" y="24" text-anchor="middle" class="label" font-size="10" fill="#FFFFFF">MOJO AI</text>
    <text x="55" y="91" text-anchor="middle" class="label" font-size="10" fill="#FFFFFF">SUMMITS</text>
    <text x="55" y="69" text-anchor="middle" class="label" font-size="52" fill="url(#accent)" filter="url(#softGlow)">M</text>
  </g>

  <text x="237" y="188" class="label" font-size="38" fill="#00E6FF">MOJO AI SUMMITS</text>
  <g class="label" font-size="31" fill="#00E6FF" text-anchor="middle">
    <text x="955" y="106">THE EXECUTIVE</text>
    <text x="955" y="146">INTELLIGENCE NETWORK</text>
  </g>

  <text x="90" y="365" class="headline" font-size="86" fill="#FFFFFF">Executive Intelligence</text>
  <text x="90" y="447" class="headline italic" font-size="86">for the AI Era</text>
  <text x="90" y="517" class="small" font-size="38" fill="#b9c0d2">Private sessions  |  Quarterly briefs  |  Annual summit and yearbook</text>
</svg>
