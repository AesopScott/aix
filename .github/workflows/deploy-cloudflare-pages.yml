name: Deploy Mojo AI Summits to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "dist/**"
      - "functions/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-pages-mojo-ai-summits
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name mojo-ai-summits --branch main
