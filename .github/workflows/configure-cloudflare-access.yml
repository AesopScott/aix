name: Configure Mojo AI Summits Cloudflare Access

on:
  workflow_dispatch:
    inputs:
      allowed_emails:
        description: "Comma-separated emails allowed into internal Mojo AI Summits pages"
        required: true
        default: "scott@mojoaistudio.com,jodi@sofractional.com,robert@cyber1grc.com"

permissions:
  contents: read

jobs:
  configure-access:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Cloudflare Access applications
        run: node scripts/configure-cloudflare-access.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          MOJO_ACCESS_ALLOWED_EMAILS: ${{ inputs.allowed_emails }}
